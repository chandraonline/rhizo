[project]
name = "rhizo"
version = "0.1.0"
description = "Personal 2nd brain engine: connectors and tooling for an Obsidian vault"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "tomli-w>=1.0",
]

[project.scripts]
rhizo = "rhizo.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhizo"]
